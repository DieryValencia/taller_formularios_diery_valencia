{% extends 'base.html' %}

{% block title %}Confirmación de Asistencia - Taller Django{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-3 text-center">
                <div class="card-body p-5">
                    <div class="mb-4">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h1 class="card-title mb-3">¡Éxito!</h1>
                    <p class="card-text mb-4">Registro de asistencia guardado correctamente.</p>
                    <a href="{% url 'asistencia_formulario' %}" class="btn btn-secondary me-2">Registrar otra asistencia</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
